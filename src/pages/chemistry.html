<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas BioBank – Chimie organică</title>
  <link rel="stylesheet" href="../styles/base.css">
  <style>
    body {
      background: #f3f6fb;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    header {
      background: linear-gradient(90deg, #071b35, #173e6a);
      color: white;
      padding: 24px;
      border-bottom: 3px solid #d8a942;
    }
    header > div, main {
      max-width: 790px;
      margin: auto;
    }
    main { padding: 32px 16px; }
    .chapter {
      background: white;
      padding: 22px;
      border-radius: 12px;
      border-left: 4px solid #d8a942;
      box-shadow: 0 4px 16px #10213a12;
    }
    .chapter h3 { margin: 8px 0 18px; }
    .test-button {
      background: #103763;
      color: white;
      border: 0;
      border-radius: 6px;
      padding: 12px 18px;
      font-weight: bold;
      cursor: pointer;
    }
    .test-button:hover { background: #20548c; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Atlas BioBank</h1>
      <p>Chimie organică – Pregătire pentru admiterea la Medicină</p>
    </div>
  </header>

  <main>
    <h2>Capitole Chimie organică</h2>
    <p>Selectează capitolul și testul pe care dorești să îl rezolvi.</p>

    <article class="chapter">
      <small>CAPITOLUL 1</small>
      <h3>Introducere în studiul chimiei organice și noțiuni de structură chimică</h3>
      <button class="test-button" id="chemistryTest1">
        Test 1 – 40 întrebări
      </button>
    </article>

    <article class="chapter" style="margin-top:16px;">
      <small>CAPITOLUL 2</small>
      <h3>Alcani</h3>
      <button class="test-button" id="chemistryTest2">Test 2 – 40 întrebări</button>
    </article>
  </main>

  <script>
    document.getElementById("chemistryTest1").addEventListener("click", () => {
      window.location.href = "./chemistry-test.html?test=1";
    });
    document.getElementById("chemistryTest2").addEventListener("click", () => {
      window.location.href = "./chemistry-test.html?test=2";
    });
  </script>
</body>
</html>
